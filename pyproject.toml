[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hyprmetaworkspaces"
version = "0.1.0"
description = "Meta-workspace daemon and CLI for Hyprland"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
hyprmetaworkspaced = "hyprmetaworkspaces.daemon:main"
hyprmwctl = "hyprmetaworkspaces.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/hyprmetaworkspaces"]

[tool.pytest.ini_options]
testpaths = ["tests"]
